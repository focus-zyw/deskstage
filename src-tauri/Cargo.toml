[package]
name = "app"
version = "0.2.0"
description = "桌面虚拟角色:演出、直播互动与桌面陪伴"
authors = ["focus"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
mouse_position = "0.1"
# unsafe-headers:允许 JS 显式传空 Origin——插件默认强加 webview 来源的 Origin,B站登录接口会 403
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
# windows 0.61 以 default-features=false 引入 windows-future;显式开 std 解锁 IAsyncOperation 的 .await
windows-future = { version = "0.2.1", features = ["std"] }
wasapi = "0.24.0"
sysinfo = "0.36.1"
windows = { version = "0.61.3", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Power", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com", "ApplicationModel_DataTransfer", "Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }
tauri-plugin-single-instance = "2.4.4"
# 截图工具条"另存为"对话框
tauri-plugin-dialog = "2"
image = { version = "0.25.6", default-features = false, features = ["png"] }
# 剪贴板图片转 base64(发给视觉模型做 AI 识别)
base64 = "0.22"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-autostart = "2.5.1"
